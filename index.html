<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Defender - Side Scroller</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        .game-container {
            max-width: 700px;
            margin: 0 auto;
            background-color: #26262b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #111;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
        }
        /* Spelplanen - Sida till sida */
        #game-arena {
            width: 100%;
            height: 300px;
            background: linear-gradient(to bottom, #1f2d3d, #2c3e50);
            border-bottom: 20px solid #553311; /* Mark/Jord */
            position: relative;
            overflow: hidden;
            cursor: crosshair; /* Sikte när man håller musen över */
            border-radius: 6px 6px 0 0;
        }
        /* DIN GUBBE */
        #hero {
            width: 40px;
            height: 50px;
            position: absolute;
            bottom: 0;
            left: 50px;
            font-size: 32px;
            line-height: 50px;
            text-align: center;
            z-index: 10;
        }
        /* MONSTER */
        .monster {
            width: 35px;
            height: 35px;
            position: absolute;
            bottom: 0;
            font-size: 28px;
            line-height: 35px;
            text-align: center;
            z-index: 5;
            transition: transform 0.1s;
        }
        /* SKOTT / PILAR */
        .laser {
            width: 12px;
            height: 6px;
            background-color: #00ffcc;
            position: absolute;
            border-radius: 3px;
            z-index: 8;
            box-shadow: 0 0 8px #00ffcc;
        }
        /* SHOP & UPGRADES */
        .shop-container {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            background: #1c1c21;
            padding: 15px;
            border-radius: 8px;
        }
        .upgrade-card {
            background: #333;
            padding: 10px;
            border-radius: 6px;
            width: 45%;
        }
        .btn {
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 8px;
            width: 100%;
        }
        .btn:hover { background-color: #e68a00; }
        .btn:disabled { background-color: #555; cursor: not-allowed; }
        
        #game-over-menu {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🏹 Monster Defender ⚔️</h1>
        
        <div class="stats-bar">
            <div>❤️ Liv: <span id="hp-display">100</span>/%</div>
            <div>💰 Guld: <span id="gold-display">0</span></div>
            <div>🧟 Våg: <span id="wave-display">1</span></div>
        </div>

        <!-- Spelplanen -->
        <div id="game-arena">
            <div id="hero">🧑‍🌾</div>
            
            <div id="game-over-menu">
                <h2 style="color: #ff3333; font-size: 2.5rem; margin: 0;">💀 BASE DESTROYED 💀</h2>
                <p>Monstren bröt igenom försvaret!</p>
                <button class="btn" onclick="location.reload()" style="max-width: 200px; background-color: #ff3333;">Försök igen</button>
            </div>
        </div>

        <p style="color: #aaa; font-size: 0.9rem; margin-top: 10px;">
            🕹️ <strong>Gå:</strong> <kbd>A</kbd> / <kbd>D</kbd> eller <strong>Vänster/Höger Piltangent</strong>. 
            🎯 <strong>Skjut:</strong> <strong>KLICKA</strong> med musen var som helst på spelskärmen!
        </p>

        <!-- Uppgraderingar -->
        <div class="shop-container">
            <div class="upgrade-card">
                <h3>🏹 Vapenhastighet</h3>
                <p>Skjut mycket snabbare</p>
                <button id="up-speed-btn" class="btn" onclick="upgradeSpeed()">Köp för 💰 <span id="speed-cost">25</span>g</button>
            </div>
            <div class="upgrade-card">
                <h3>💥 Pilskada (DMG)</h3>
                <p>Nuvarande skada: <span id="dmg-display">5</span></p>
                <button id="up-dmg-btn" class="btn" onclick="upgradeDmg()">Köp för 💰 <span id="dmg-cost">20</span>g</button>
            </div>
        </div>
    </div>

    <script>
        // Spelvariabler
        let heroX = 80;
        let heroHp = 100;
        let gold = 0;
        let damage = 5;
        let attackSpeed = 400; // Millisekunder mellan skott (lägre = snabbare)
        let lastShotTime = 0;

        let wave = 1;
        let monsters = [];
        let playerProjectiles = [];
        let activeKeys = {};
        let isDead = false;

        let costSpeed = 25;
        let costDmg = 20;

        const arena = document.getElementById('game-arena');
        const heroEl = document.getElementById('hero');

        // Hantera tangentbords-tryck för att gå höger/vänster
        window.addEventListener('keydown', (e) => { activeKeys[e.code] = true; });
        window.addEventListener('keyup', (e) => { activeKeys[e.code] = false; });

        // KLICKA PÅ SKÄRMEN FÖR ATT SKJUTA MÅLSÖKANDE/RIKTADE SKOTT
        arena.addEventListener('mousedown', (e) => {
            if (isDead) return;
            
            let currentTime = Date.now();
            if (currentTime - lastShotTime < attackSpeed) return; // Attack speed spärr
            lastShotTime = currentTime;

            // Räkna ut klickpositionen inuti spelarenan
            let rect = arena.getBoundingClientRect();
            let clickX = e.clientX - rect.left;
            let clickY = e.clientY - rect.top;

            // Skapa skottet
            let laser = document.createElement('div');
            laser.className = 'laser';
            
            // Startposition vid gubben
            let startX = heroX + 25;
            let startY = 260; // Höjd vid gubbens hand
            laser.style.left = startX + 'px';
            laser.style.top = startY + 'px';
            arena.appendChild(laser);

            // Räkna ut vinkeln/riktningen till där man klickade
            let angle = Math.atan2(clickY - startY, clickX - startX);

            playerProjectiles.push({
                el: laser,
                x: startX,
                y: startY,
                speed: 7,
                cos: Math.cos(angle),
                sin: Math.sin(angle)
            });
        });

        // Skapa monster-vågor från höger sida
        function spawnMonsterWave() {
            if (monsters.length === 0 && !isDead) {
                let count = 3 + wave;
                for (let i = 0; i < count; i++) {
                    let mEl = document.createElement('div');
                    mEl.className = 'monster';
                    
                    // Slumpa monster-typ (Grön slime eller rött monster)
                    let isSlime = Math.random() > 0.4;
                    mEl.innerText = isSlime ? '🤢' : '👹';

                    // Starta utspritt långt till höger utanför skärmen
                    let startX = 720 + (i * 60) + Math.random() * 30;
                    mEl.style.left = startX + 'px';
                    mEl.style.bottom = '0px';
                    arena.appendChild(mEl);

                    monsters.push({
                        el: mEl,
                        x: startX,
                        hp: isSlime ? 4 + (wave * 2) : 10 + (wave * 3),
                        speed: isSlime ? 0.9 + (wave * 0.05) : 1.4 + (wave * 0.05),
                        isSlime: isSlime
                    });
                }
                document.getElementById('wave-display').innerText = wave;
                wave++;
            }
        }

        // Uppgradering: Skjut snabbare
        function upgradeSpeed() {
            if (gold >= costSpeed && attackSpeed > 100) {
                gold -= costSpeed;
                attackSpeed -= 50; // Sänker fördröjningen = skjuter snabbare
                costSpeed = Math.floor(costSpeed * 1.6);
                updateUI();
            }
        }

        // Uppgradering: Mer skada
        function upgradeDmg() {
            if (gold >= costDmg) {
                gold -= costDmg;
                damage += 4;
                costDmg = Math.floor(costDmg * 1.5);
                updateUI();
            }
        }

        function updateUI() {
            document.getElementById('gold-display').innerText = gold;
            document.getElementById('hp-display').innerText = Math.max(0, heroHp);
            document.getElementById('dmg-display').innerText = damage;
            document.getElementById('speed-cost').innerText = costSpeed;
            document.getElementById('dmg-cost').innerText = costDmg;

            document.getElementById('up-speed-btn').disabled = gold < costSpeed || attackSpeed <= 100;
            document.getElementById('up-dmg-btn').disabled = gold < costDmg;
            
            if (attackSpeed <= 100) {
