<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Enkelt Klick Spel</title>
    <style>
        body { background-color: #222; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .box { max-width: 500px; margin: 0 auto; background: #333; padding: 20px; border-radius: 8px; }
        
        /* Spelplanen */
        #bana { width: 100%; height: 200px; background: #4caf50; border-bottom: 15px solid #6d4c41; position: relative; overflow: hidden; }
        
        /* Gubben */
        #gubbe { position: absolute; bottom: 0px; left: 50px; font-size: 30px; width: 40px; height: 40px; }
        
        /* Monster och skott */
        .slime { position: absolute; bottom: 0px; font-size: 30px; width: 40px; height: 40px; }
        .skott { position: absolute; bottom: 15px; width: 12px; height: 12px; background: yellow; border-radius: 50%; }
        
        /* Knappar */
        .knapp { background: #ff9800; color: #fff; border: none; padding: 15px; font-size: 1.1rem; font-weight: bold; border-radius: 5px; cursor: pointer; margin: 5px; }
        .knapp:active { background: #e68a00; }
        .styr-knapp { background: #2196f3; width: 100px; }
        .skjut-knapp { background: #e91e63; width: 120px; }
    </style>
</head>
<body>

    <div class="box">
        <h2>⚔️ Klick-Försvar ⚔️</h2>
        <p>❤️ Liv: <span id="liv">100</span> | 💰 Guld: <span id="pengar">0</span></p>

        <div id="bana">
            <div id="gubbe">🧑‍🌾</div>
        </div>

        <!-- STARTKNAPP -->
        <button class="knapp" style="width:90%; background:#4caf50;" onclick="startaVag()">👾 STARTA FIENDERNA</button>

        <!-- STYRNING (Bara vanliga knappar man klickar på) -->
        <div style="margin-top: 15px;">
            <button class="knapp styr-knapp" onclick="gaVanster()">◀ VÄNSTER</button>
            <button class="knapp skjut-knapp" onclick="skjut()">💥 SKJUT!</button>
            <button class="knapp styr-knapp" onclick="gaHoger()">HÖGER ▶</button>
        </div>
    </div>

    <script>
        let x = 50;
        let hp = 100;
        let guld = 0;
        let monsterLista = [];
        let skottLista = [];

        const bana = document.getElementById('bana');
        const gubbe = document.getElementById('gubbe');

        // Funktioner för att flytta gubben
        function gaVanster() {
            x -= 30;
            if (x < 0) x = 0;
            gubbe.style.left = x + 'px';
        }

        function gaHoger() {
            x += 30;
            let maxFast = bana.clientWidth - 40;
            if (x > maxFast) x = maxFast;
            gubbe.style.left = x + 'px';
        }

        // Funktion för att skjuta ett skott rakt framåt
        function skjut() {
            let sEl = document.createElement('div');
            sEl.className = 'skott';
            
            let sX = x + 30;
            sEl.style.left = sX + 'px';
            bana.appendChild(sEl);

            skottLista.push({ el: sEl, x: sX });
        }

        // Starta monstren manuellt
        function startaVag() {
            // Skapa 4 slimes utanför skärmen till höger
            for (let i = 0; i < 4; i++) {
                let mEl = document.createElement('div');
                mEl.className = 'slime';
                mEl.innerText = '🤢';
                
                let mX = bana.clientWidth + (i * 80);
                mEl.style.left = mX + 'px';
                bana.appendChild(mEl);

                monsterLista.push({ el: mEl, x: mX });
            }
        }

        // Spelloop som flyttar skott och monster (Inget avancerat)
        function rullaSpel() {
            if (hp <= 0) return;

            // 1. Flytta skott till höger
            for (let i = skottLista.length - 1; i >= 0; i--) {
                let s = skottLista[i];
                s.x += 7;
                s.el.style.left = s.x + 'px';

                // Kolla om skottet träffar en slime
                for (let j = monsterLista.length - 1; j >= 0; j--) {
                    let m = monsterLista[j];
                    if (Math.abs(s.x - m.x) < 25) {
                        // Träff! Ta bort båda
                        s.el.remove();
                        skottLista.splice(i, 1);
                        
                        m.el.remove();
                        monsterLista.splice(j, 1);
                        
                        guld += 5;
                        document.getElementById('pengar').innerText = guld;
                        break;
                    }
                }

                // Ta bort skott utanför skärmen
                if (s.x > bana.clientWidth) {
                    s.el.remove();
                    skottLista.splice(i, 1);
                }
            }

            // 2. Flytta monster till vänster
            for (let i = monsterLista.length - 1; i >= 0; i--) {
                let m = monsterLista[i];
                m.x -= 1.5;
                m.el.style.left = m.x + 'px';

                // Om monstret når vänsterkanten
                if (m.x <= 0) {
                    hp -= 25;
                    document.getElementById('liv').innerText = Math.max(0, hp);
                    m.el.remove();
                    monsterLista.splice(i, 1);

                    if (hp <= 0) {
                        alert("GAME OVER! Uppdatera sidan för att köra igen.");
                    }
                }
            }

            requestAnimationFrame(rullaSpel);
        }

        // Kör loopen
        rullaSpel();
    </script>
</body>
</html>
