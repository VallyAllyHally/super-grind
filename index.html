<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Escape</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        .game-container {
            max-width: 550px;
            margin: 0 auto;
            background-color: #222;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #444;
        }
        .top-bar {
            display: flex;
            justify-content: space-around;
            background-color: #333;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            font-size: 1.2rem;
            font-weight: bold;
        }
        /* Spelplanen - Mörk grotta */
        #map {
            width: 500px;
            height: 400px;
            background-color: #2c3e50;
            border: 4px solid #7f8c8d;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            border-radius: 5px;
        }
        /* SPELAREN (Gubben) */
        #player {
            width: 30px;
            height: 30px;
            position: absolute;
            font-size: 26px;
            line-height: 30px;
            text-align: center;
            z-index: 10;
        }
        /* SVÄRDETS TRÄFFOMRÅDE (Visas som en ljusblå ring runt gubben när han slår) */
        #sword-slash {
            width: 80px;
            height: 80px;
            border: 3px solid #00d2ff;
            background-color: rgba(0, 210, 255, 0.2);
            border-radius: 50%;
            position: absolute;
            display: none;
            z-index: 9;
            transform: translate(-25px, -25px); /* Centrera runt gubben */
        }
        /* MONSTER (Slimes) */
        .slime {
            width: 26px;
            height: 26px;
            position: absolute;
            font-size: 22px;
            line-height: 26px;
            text-align: center;
            z-index: 5;
        }
        /* NYCKLAR */
        .key {
            width: 25px;
            height: 25px;
            position: absolute;
            font-size: 20px;
            line-height: 25px;
            z-index: 4;
            animation: bounce 0.5s infinite alternate;
        }
        /* UTGÅNGEN (Porten) */
        #door {
            width: 40px;
            height: 40px;
            position: absolute;
            top: 10px;
            left: 230px;
            font-size: 32px;
            line-height: 40px;
            z-index: 3;
            background-color: #34495e;
            border-radius: 5px;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-5px); }
        }
        /* SKÄRMAR */
        .screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h2>🗝️ Grott-Smitaren (Dungeon Escape)</h2>
        
        <div class="top-bar">
            <div>❤️ Liv: <span id="hp-text">5</span>/5</div>
            <div>🔑 Nycklar: <span id="key-text">0</span>/3</div>
        </div>

        <div id="map">
            <!-- Porten ut -->
            <div id="door">🚪</div>
            
            <!-- Spelaren och hans svärds-ring -->
            <div id="player">
                🧑‍🌾
                <div id="sword-slash"></div>
            </div>

            <!-- Game Over Skärm -->
            <div id="game-over-screen" class="screen">
                <h1 style="color: #c0392b; margin: 0;">💀 GAME OVER</h1>
                <p>Monstren tog dig!</p>
                <button class="btn" onclick="location.reload()" style="background-color: #c0392b;">Försök igen</button>
            </div>

            <!-- Vinst Skärm -->
            <div id="win-screen" class="screen">
                <h1 style="color: #f1c40f; margin: 0;">🎉 DU VANN!</h1>
                <p>Du samlade alla nycklar och flydde grottan!</p>
                <button class="btn" onclick="location.reload()">Spela igen</button>
            </div>
        </div>

        <p style="color: #888; font-size: 0.9rem; margin-top: 15px;">
            🕹️ <strong>Styrning:</strong> Använd <strong>Piltangenterna</strong> eller <strong>WASD</strong> för att gå runt.<br>
            ⚔️ <strong>Attack:</strong> Du svingar ditt svärd automatiskt i en cirkel runt dig hela tiden!
        </p>
    </div>

    <script>
        // Spelinställningar
        let pX = 235, pY = 300; // Starta nere i mitten
        let pHp = 5;
        let keysFound = 0;
        let isDead = false;
        let hasWon = false;

        let slimes = [];
        let items = [];
        let activeKeys = {};
        let swordActive = false;
        let swordTimer = 0;

        const playerEl = document.getElementById('player');
        const swordEl = document.getElementById('sword-slash');
        const mapEl = document.getElementById('map');

        // Lyssna på tangentbordet
        window.addEventListener('keydown', (e) => { 
            activeKeys[e.code] = true; 
            if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
        });
        window.addEventListener('keyup', (e) => { activeKeys[e.code] = false; });

        // Skapa 3 guldnycklar på slumpmässiga ställen
        function spawnKeys() {
            for (let i = 0; i < 3; i++) {
                let kEl = document.createElement('div');
                kEl.className = 'key';
                kEl.innerText = '🔑';
                
                let kX = Math.random() * 440 + 30;
                let kY = Math.random() * 240 + 100; // Håll dem borta från dörren i början
                
                kEl.style.left = kX + 'px';
                kEl.style.top = kY + 'px';
                mapEl.appendChild(kEl);

                items.push({ el: kEl, x: kX, y: kY });
            }
        }

        // Skapa ett nytt monster (Slime)
        function spawnSlime() {
            if (isDead || hasWon || slimes.length >= 6) return;

            let sEl = document.createElement('div');
            sEl.className = 'slime';
            sEl.innerText = '🤢';

            // Spawnar på sidorna
            let sX = Math.random() > 0.5 ? 10 : 460;
            let sY = Math.random() * 300 + 50;

            sEl.style.left = sX + 'px';
            sEl.style.top = sY + 'px';
            mapEl.appendChild(sEl);

            slimes.push({ el: sEl, x: sX, y: sY, speed: 1 + Math.random() * 0.8 });
        }

        // HUVUDLOOPEN (60 Frames per sekund)
        function gameLoop() {
            if (isDead || hasWon) return;

            // 1. GÅ (Flytta gubben)
            let speed = 3.5;
            if (activeKeys['KeyW'] || activeKeys['ArrowUp']) pY -= speed;
            if (activeKeys['KeyS'] || activeKeys['ArrowDown']) pY += speed;
            if (activeKeys['KeyA'] || activeKeys['ArrowLeft']) pX -= speed;
            if (activeKeys['KeyD'] || activeKeys['ArrowRight']) pX += speed;

            // Håll gubben inom grottans väggar
            pX = Math.max(10, Math.min(460, pX));
            pY = Math.max(10, Math.min(360, pY));

            playerEl.style.left = pX + 'px';
            playerEl.style.top = pY + 'px';

            // 2. AUTOMATISKT SVÄRD-SVING (Varje 1.2 sekund)
            swordTimer++;
            if (swordTimer % 75 === 0) {
                swordActive = true;
                swordEl.style.display = 'block';
                
                // Kolla om svärds-cirkeln träffar monster
                for (let i = slimes.length - 1; i >= 0; i--) {
                    let s = slimes[i];
                    // Avstånd från spelarens mitt till monstret
                    let dist = Math.hypot((pX + 15) - (s.x + 13), (pY + 15) - (s.y + 13));
                    if (dist < 55) { // Inom svärdets räckvidd
                        s.el.remove();
                        slimes.splice(i, 1);
                    }
                }

                // Göm svärds-ringen efter en kort stund
                setTimeout(() => {
                    swordEl.style.display = 'none';
                    swordActive = false;
                }, 200);
            }

            // 3. HANTERA MONSTER (Slimes)
            slimes.forEach((s, index) => {
                // Monstren går direkt mot spelaren
                let angle = Math.atan2(pY - s.y, pX - s.x);
                s.x += Math.cos(angle) * s.speed;
                s.y += Math.sin(angle) * s.speed;

                s.el.style.left = s.x + 'px';
                s.el.style.top = s.y + 'px';

                // Kolla om monstret biter gubben
                let dist = Math.hypot((pX + 15) - (s.x + 13), (pY + 15) - (s.y + 13));
                if (dist < 22 && !swordActive) {
                    pHp--;
                    document.getElementById('hp-text').innerText = pHp;
                    
                    // Knuffa bort monstret lite så man inte dör direkt
                    s.x -= Math.cos(angle) * 40;
                    s.y -= Math.sin(angle) * 40;

                    if (pHp <= 0) {
                        isDead = true;
