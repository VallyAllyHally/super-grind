<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Grind Spel</title>
    <style>
        body {
            background-color: #1e1e24;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .game-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #2a2a35;
            padding: 20px;
            border-radius: 10px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            background: #1a1a20;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            font-size: 1.1rem;
        }
        /* Spelplanen - Gräsmatta */
        #game-board {
            width: 500px;
            height: 400px;
            background-color: #43523d;
            border: 4px solid #8B4513;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }
        /* SPELAREN (Blå gubbe med svärd-emoji) */
        #player {
            width: 30px;
            height: 30px;
            background-color: #3a68ad;
            border-radius: 50%;
            position: absolute;
            font-size: 16px;
            line-height: 30px;
            transition: transform 0.1s;
            z-index: 10;
        }
        #sword {
            position: absolute;
            font-size: 20px;
            display: none;
            z-index: 11;
        }
        /* FIENDER */
        .enemy {
            width: 26px;
            height: 26px;
            background-color: #a62c2c;
            border-radius: 50%;
            position: absolute;
            font-size: 14px;
            line-height: 26px;
            z-index: 5;
        }
        /* PILAR */
        .projectile {
            width: 8px;
            height: 8px;
            background-color: #ffeb3b;
            border-radius: 50%;
            position: absolute;
            z-index: 4;
            box-shadow: 0 0 5px yellow;
        }
        .upgrade-btn {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 10px 5px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        .upgrade-btn:disabled { background-color: #555; }
        #game-over {
            display: none;
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 30px;
            border: 3px solid red;
            border-radius: 10px;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>⚔️ RPG Monster Grind ⚔️</h1>
        
        <div class="stats">
            <div>❤️ Liv: <span id="hp">100</span>/<span id="max-hp">100</span></div>
            <div>💰 Guld: <span id="gold">0</span></div>
            <div>👾 Våg: <span id="level">1</span></div>
        </div>

        <div id="game-board">
            <!-- Gubben (visar sig som en gubbe-emoji) -->
            <div id="player">🧑‍🌾</div>
            <!-- Svärdet -->
            <div id="sword">⚔️</div>
            
            <div id="game-over">
                <h2>💀 GAME OVER 💀</h2>
                <button class="upgrade-btn" onclick="location.reload()">Starta om</button>
            </div>
        </div>

        <p style="color: #bbb; font-size: 0.9rem;">🕹️ Gå med <strong>Piltangenterna</strong> / <strong>WASD</strong>. Slå med <strong>Mellanslag (Space)</strong>!</p>
        
        <button id="buy-hp" class="upgrade-btn" onclick="buyHp()">Mer Max-HP (+20) | 💰 <span id="hp-cost">20</span>g</button>
        <button id="buy-dmg" class="upgrade-btn" onclick="buyDmg()">Starkare Svärd (+3) | 💰 <span id="dmg-cost">15</span>g</button>
    </div>

    <script>
        // Startpositioner och stats
        let pX = 235, pY = 185;
        let pHp = 100, pMaxHp = 100, pGold = 0, pDmg = 5;
        let wave = 1, hpCost = 20, dmgCost = 15;
        let isAttacking = false;
        let direction = 'right';
        let enemies = [];
        let projectiles = [];
        let keys = {};

        const board = document.getElementById('game-board');
        const playerEl = document.getElementById('player');
        const swordEl = document.getElementById('sword');

        // Uppdatera gubbens position på skärmen direkt
        function drawPlayer() {
            playerEl.style.left = pX + 'px';
            playerEl.style.top = pY + 'px';
        }

        // Kontroller
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space' && !isAttacking) {
                attack();
            }
            if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
        });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        function attack() {
            isAttacking = true;
            swordEl.style.display = 'block';
            
            // Placera svärdet framför gubben baserat på håll
            let sX = pX, sY = pY;
            if (direction === 'right') { sX += 25; sY -= 5; }
            if (direction === 'left') { sX -= 25; sY -= 5; }
            if (direction === 'up') { sX -= 5; sY -= 25; }
            if (direction === 'down') { sX -= 5; sY += 25; }
            
            swordEl.style.left = sX + 'px';
            swordEl.style.top = sY + 'px';

            // Kolla om vi träffar monster
            enemies.forEach((en, index) => {
                let dist = Math.hypot((sX+10) - (en.x+13), (sY+10) - (en.y+13));
                if (dist < 30) {
                    en.hp -= pDmg;
                    if (en.hp <= 0) {
                        en.el.remove();
                        enemies.splice(index, 1);
                        pGold += 5;
                    }
                }
            });

            setTimeout(() => {
                swordEl.style.display = 'none';
                isAttacking = false;
                updateUI();
            }, 150);
        }

        // Skapa fiender (Både vanliga och pilbågsskyttar 🏹)
        function spawnEnemies() {
            if (enemies.length === 0) {
                let count = 2 + wave;
                for (let i = 0; i < count; i++) {
                    let el = document.createElement('div');
                    el.className = 'enemy';
                    
                    // Slumpa om det är en vanlig eller en bågskytt
                    let isArcher = Math.random() > 0.5;
                    el.innerText = isArcher ? '🏹' : '👹';
                    if (isArcher) el.style.backgroundColor = '#9c27b0'; // Lila färg för bågskyttar

                    let x = Math.random() > 0.5 ? 10 : 460;
                    let y = Math.random() * 340 + 20;
                    board.appendChild(el);

                    enemies.push({
                        el: el, x: x, y: y,
                        hp: 5 + (wave * 2),
                        isArcher: isArcher,
                        shootCooldown: Math.random() * 60 + 30
                    });
                }
                document.getElementById('level').innerText = wave;
                wave++;
            }
        }

        function buyHp() {
            if (pGold >= hpCost) { pGold -= hpCost; pMaxHp += 20; pHp = pMaxHp; hpCost = Math.floor(hpCost*1.5); updateUI(); }
        }
        function buyDmg() {
            if (pGold >= dmgCost) { pGold -= dmgCost; pDmg += 3; dmgCost = Math.floor(dmgCost*1.6); updateUI(); }
        }

        function updateUI() {
            document.getElementById('hp').innerText = Math.round(pHp);
            document.getElementById('max-hp').innerText = pMaxHp;
            document.getElementById('gold').innerText = pGold;
            document.getElementById('hp-cost').innerText = hpCost;
            document.getElementById('dmg-cost').innerText = dmgCost;
            document.getElementById('buy-hp').disabled = pGold < hpCost;
            document.getElementById('buy-dmg').disabled = pGold < dmgCost;
        }

        // Huvudloop (Körs hela tiden)
        function updateGame() {
            if (pHp <= 0) {
                document.getElementById('game-over').style.display = 'block';
                return;
            }

            // Flytta gubben
            let speed = 4;
            if (keys['KeyW'] || keys['ArrowUp']) { pY -= speed; direction = 'up'; }
            if (keys['KeyS'] || keys['ArrowDown']) { pY += speed; direction = 'down'; }
            if (keys['KeyA'] || keys['ArrowLeft']) { pX -= speed; direction = 'left'; }
            if (keys['KeyD'] || keys['ArrowRight']) { pX += speed; direction = 'right'; }

            // Gränser för banan
            pX = Math.max(0, Math.min(470, pX));
            pY = Math.max(0, Math.min(370, pY));
            drawPlayer();

            spawnEnemies();

            // Hantera fiender
            enemies.forEach((en) => {
                let angle = Math.atan2(pY - en.y, pX - en.x);
                
                if (en.isArcher) {
                    // Pilbågsskyttar håller lite avstånd
                    let distToPlayer = Math.hypot(pX - en.x, pY - en.y);
                    if (distToPlayer > 150) {
                        en.x += Math.cos(angle) * 1;
                        en.y += Math.sin(angle) * 1;
                    } else if (distToPlayer < 100) {
                        en.x -= Math.cos(angle) * 1;
                        en.y -= Math.sin(angle) * 1;
                    }

                    // Skjut pil 🏹
                    en.shootCooldown--;
                    if (en.shootCooldown <= 0) {
