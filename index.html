<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warhammer 40k Datasheet Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header / Logotyp -->
    <header class="wh-header">
        <h1>40K DATASHEET ARCHIVE</h1>
        <p>Knappa in en enhet för att hämta poäng, stats, förmågor och vapenprofiler.</p>
    </header>

    <!-- Söksektion -->
    <main class="search-container">
        <div class="search-box">
            <input type="text" id="unitSearch" placeholder="Exempel: Intercessor Squad, Space Marine Captain...">
            <button id="searchBtn">Sök Enhet</button>
        </div>

        <!-- Resultat-område (Här laddas datan dynamiskt via JavaScript) -->
        <section id="resultArea" class="result-area">
            <!-- Startmeddelande innan man har sökt -->
            <div class="placeholder-text">
                <p>Väntar på order från Imperiet... Ange en enhet ovan för att scanna databanken.</p>
            </div>
        </section>
    </main>

    <!-- Sidfot -->
    <footer>
        <p>Detta är ett hobbyprojekt och är inte officiellt associerat med Games Workshop.</p>
    </footer>

    <!-- JavaScript-länk som styr sökfunktionen -->
    <script src="app.js"></script>
</body>
</html>
