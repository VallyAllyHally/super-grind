<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Grind</title>
    <style>
        body {
            background-color: #1e1e24;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .game-container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #2a2a35;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .stats {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        .monster-area {
            border: 2px solid #ff4a4a;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            background-color: #342323;
        }
        button {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
            transform: none;
        }
        .attack-btn {
            background-color: #ff4a4a;
            width: 100%;
            font-size: 1.3rem;
            margin-bottom: 10px;
        }
        .shop {
            margin-top: 30px;
            border-top: 1px solid #444;
            padding-top: 20px;
        }
        .upgrade-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
            background: #222;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>⚔️ Monster Grind ⚔️</h1>
        
        <div class="stats">
            <p>💰 Guld: <span id="gold">0</span></p>
            <p>💪 Skada per klick: <span id="click-power">1</span></p>
            <p>🤖 Automatisk skada/sek: <span id="dps">0</span></p>
        </div>

        <div class="monster-area">
            <h3>👾 <span id="monster-name">Slime</span></h3>
            <p>Liv: <span id="monster-hp">10</span> / <span id="monster-max-hp">10</span></p>
            <button class="attack-btn" onclick="attackMonster()">SLÅ!</button>
        </div>

        <div class="shop">
            <h2>Upgrades 🛒</h2>
            
            <div class="upgrade-item">
                <span>Vassare Svärd (+1 Klickskada)</span>
                <button id="upgrade-click" onclick="buyClickUpgrade()">Köp (Kostnad: <span id="click-cost">10</span> guld)</button>
            </div>

            <div class="upgrade-item">
                <span>Hyrd Krigare (+1 Skada/sek)</span>
                <button id="upgrade-dps" onclick="buyDpsUpgrade()">Köp (Kostnad: <span id="dps-cost">50</span> guld)</button>
            </div>
        </div>
    </div>

    <script>
        // Speldata (Stats)
        let gold = 0;
        let clickPower = 1;
        let dps = 0;

        // Monsterdata
        let monsterMaxHp = 10;
        let monsterHp = 10;
        let monsterLevel = 1;

        // Kostnader för upgrades
        let clickCost = 10;
        let dpsCost = 50;

        // Element från HTML
        const goldEl = document.getElementById('gold');
        const clickPowerEl = document.getElementById('click-power');
        const dpsEl = document.getElementById('dps');
        const monsterHpEl = document.getElementById('monster-hp');
        const monsterMaxHpEl = document.getElementById('monster-max-hp');
        const monsterNameEl = document.getElementById('monster-name');
        
        const clickCostEl = document.getElementById('click-cost');
        const dpsCostEl = document.getElementById('dps-cost');
        const upgradeClickBtn = document.getElementById('upgrade-click');
        const upgradeDpsBtn = document.getElementById('upgrade-dps');

        // Funktion för att slå på monstret
        function attackMonster() {
            monsterHp -= clickPower;
            if (monsterHp <= 0) {
                monsterKilled();
            }
            updateUI();
        }

        // När ett monster dör
        function monsterKilled() {
            // Ge guld baserat på monstret
            let goldEarned = monsterLevel * 5;
            gold += goldEarned;

            // Gör nästa monster starkare
            monsterLevel++;
            monsterMaxHp = Math.floor(10 * Math.pow(1.3, monsterLevel));
            monsterHp = monsterMaxHp;

            // Byt namn ibland bara för kul skoj
            const names = ["Slime", "Goblin", "Ork", "Skelett", "Drake", "Demon"];
            let nameIndex = Math.min(Math.floor(monsterLevel / 5), names.length - 1);
            monsterNameEl.innerText = names[nameIndex] + " (Lv. " + monsterLevel + ")";
        }

        // Köp starkare klick
        function buyClickUpgrade() {
            if (gold >= clickCost) {
                gold -= clickCost;
                clickPower += 1;
                clickCost = Math.floor(clickCost * 1.5);
                updateUI();
            }
        }

        // Köp automatisk skada (DPS)
        function buyDpsUpgrade() {
            if (gold >= dpsCost) {
                gold -= dpsCost;
                dps += 1;
                dpsCost = Math.floor(dpsCost * 1.6);
                updateUI();
            }
        }

        // Uppdatera allt på skärmen och kolla om råd med upgrades
        function updateUI() {
            goldEl.innerText = gold;
            clickPowerEl.innerText = clickPower;
            dpsEl.innerText = dps;
            monsterHpEl.innerText = monsterHp;
            monsterMaxHpEl.innerText = monsterMaxHp;
            
            clickCostEl.innerText = clickCost;
            dpsCostEl.innerText = dpsCost;

            // Aktivera/Inaktivera knappar baserat på guld
            upgradeClickBtn.disabled = gold < clickCost;
            upgradeDpsBtn.disabled = gold < dpsCost;
        }

        // Automatisk skada varje sekund (DPS)
        setInterval(function() {
            if (dps > 0) {
                monsterHp -= dps;
                if (monsterHp <= 0) {
                    monsterKilled();
                }
                updateUI();
            }
        }, 1000);

        // Körs vid start för att nollställa knappar
        updateUI();
    </script>
</body>
</html>
