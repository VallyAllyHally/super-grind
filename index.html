<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Monster Grind</title>
    <style>
        body {
            background-color: #1e1e24;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .game-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #2a2a35;
            padding: 20px;
            border-radius: 10px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            background: #1a1a20;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            font-size: 1.1rem;
        }
        /* Spelplanen - Gräsmatta */
        #game-board {
            width: 500px;
            height: 400px;
            background-color: #43523d;
            border: 4px solid #8B4513;
            margin: 0 auto;
            position: relative; /* VIKTIGT: Gör så att saker kan flyttas inuti rutan */
            overflow: hidden;
        }
        /* SPELAREN (Din gubbe) */
        #player {
            width: 32px;
            height: 32px;
            position: absolute;
            font-size: 24px;
            line-height: 32px;
            text-align: center;
            left: 235px; /* Startar i mitten */
            top: 185px;  /* Startar i mitten */
            z-index: 10;
        }
        /* SVÄRDET */
        #sword {
            position: absolute;
            font-size: 24px;
            display: none;
            z-index: 11;
        }
        /* FIENDER (Slimes och monster) */
        .enemy {
            width: 30px;
            height: 30px;
            position: absolute;
            font-size: 22px;
            line-height: 30px;
            text-align: center;
            z-index: 5;
        }
        /* PILAR */
        .projectile {
            width: 10px;
            height: 10px;
            background-color: #ffeb3b;
            border-radius: 50%;
            position: absolute;
            z-index: 4;
            box-shadow: 0 0 5px yellow;
        }
        .upgrade-btn {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 10px 5px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        .upgrade-btn:disabled { background-color: #555; }
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 30px;
            border: 3px solid red;
            border-radius: 10px;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>⚔️ RPG Monster Grind ⚔️</h1>
        
        <div class="stats">
            <div>❤️ Liv: <span id="hp">100</span>/<span id="max-hp">100</span></div>
            <div>💰 Guld: <span id="gold">0</span></div>
            <div>👾 Våg: <span id="level">1</span></div>
        </div>

        <div id="game-board">
            <!-- Gubben hamnar nu i mitten direkt från start -->
            <div id="player" style="left: 235px; top: 185px;">🧑‍🌾</div>
            <!-- Svärdet -->
            <div id="sword">⚔️</div>
            
            <div id="game-over">
                <h2>💀 GAME OVER 💀</h2>
                <button class="upgrade-btn" onclick="location.reload()">Starta om</button>
            </div>
        </div>

        <p style="color: #bbb; font-size: 0.9rem;">🕹️ Gå med <strong>Piltangenterna</strong> / <strong>WASD</strong>. Slå med <strong>Mellanslag (Space)</strong>!</p>
        
        <button id="buy-hp" class="upgrade-btn" onclick="buyHp()">Mer Max-HP (+20) | 💰 <span id="hp-cost">20</span>g</button>
        <button id="buy-dmg" class="upgrade-btn" onclick="buyDmg()">Starkare Svärd (+3) | 💰 <span id="dmg-cost">15</span>g</button>
    </div>

    <script>
        // Startpositioner i mitten av den 500x400 stora banan
        let pX = 235, pY = 185;
        let pHp = 100, pMaxHp = 100, pGold = 0, pDmg = 5;
        let wave = 1, hpCost = 20, dmgCost = 15;
        let isAttacking = false;
        let direction = 'right';
        let enemies = [];
        let projectiles = [];
        let keys = {};

        const board = document.getElementById('game-board');
        const playerEl = document.getElementById('player');
        const swordEl = document.getElementById('sword');

        // Kontroller för att trycka ner tangenter
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space' && !isAttacking) {
                attack();
            }
            if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
        });
        
        // När man släpper tangenten
        window.addEventListener('keyup', (e) => { 
            keys[e.code] = false; 
        });

        // Svärdsattack
        function attack() {
            isAttacking = true;
            swordEl.style.display = 'block';
            
            let sX = pX, sY = pY;
            if (direction === 'right') { sX += 28; sY += 2; }
            if (direction === 'left') { sX -= 24; sY += 2; }
            if (direction === 'up') { sX += 2; sY -= 24; }
            if (direction === 'down') { sX += 2; sY += 28; }
            
            swordEl.style.left = sX + 'px';
            swordEl.style.top = sY + 'px';

            // Kolla om svärdet träffar fiender
            for (let i = enemies.length - 1; i >= 0; i--) {
                let en = enemies[i];
                let dist = Math.hypot(sX - en.x, sY - en.y);
                if (dist < 35) {
                    en.hp -= pDmg;
                    if (en.hp <= 0) {
                        en.el.remove();
                        enemies.splice(i, 1);
                        pGold += 5;
                    }
                }
            }

            setTimeout(() => {
                swordEl.style.display = 'none';
                isAttacking = false;
                updateUI();
            }, 150);
        }

        // Skapa fiender (Gröna Slimes 🤢, Monster 👹 och Bågskyttar 🏹)
        function spawnEnemies() {
            if (enemies.length === 0) {
                let count = 2 + wave;
                for (let i = 0; i < count; i++) {
                    let el = document.createElement('div');
                    el.className = 'enemy';
                    
                    // Slumpa fram 3 olika sorters fiender!
                    let rand = Math.random();
                    let isArcher = false;
                    let isSlime = false;

                    if (rand < 0.4) {
                        el.innerText = '🤢'; // Slime!
                        isSlime = true;
                    } else if (rand < 0.7) {
                        el.innerText = '👹'; // Vanligt monster
                    } else {
                        el.innerText = '🏹'; // Bågskytt
                        isArcher = true;
                    }

                    // Placera ut dem längs kanterna så de inte spawnar direkt på spelaren
                    let x = Math.random() > 0.5 ? 15 : 455;
                    let y = Math.random() * 330 + 30;
                    
                    el.style.left = x + 'px';
                    el.style.top = y + 'px';
                    board.appendChild(el);

                    enemies.push({
                        el: el, x: x, y: y,
                        hp: isSlime ? 4 + wave : 6 + (wave * 2),
                        isArcher: isArcher,
                        isSlime: isSlime,
                        speed: isSlime ? 0.7 : 1.2, // Slimes rör sig lite långsammare
                        shootCooldown: Math.random() * 50 + 40
                    });
                }
                document.getElementById('level').innerText = wave;
                wave++;
            }
        }

        function buyHp() {
            if (pGold >= hpCost) { pGold -= hpCost; pMaxHp += 20; pHp = pMaxHp; hpCost = Math.floor(hpCost*1.5); updateUI(); }
        }
        function buyDmg() {
            if (pGold >= dmgCost) { pGold -= dmgCost; pDmg += 3; dmgCost = Math.floor(dmgCost*1.6); updateUI(); }
        }

        function updateUI() {
            document.getElementById('hp').innerText = Math.round(pHp);
            document.getElementById('max-hp').innerText = pMaxHp;
            document.getElementById('gold').innerText = pGold;
            document.getElementById('hp-cost').innerText = hpCost;
            document.getElementById('dmg-cost').innerText = dmgCost;
            document.getElementById('buy-hp').disabled = pGold < hpCost;
            document.getElementById('buy-dmg').disabled = pGold < dmgCost;
        }

        // Spelloopen som uppdaterar rörelser hela tiden
        function updateGame() {
            if (pHp <= 0) {
                document.getElementById('game-over').style.display = 'block';
                return;
            }

            // Gå-hastighet
            let speed = 4;
            if (keys['KeyW'] || keys['ArrowUp']) { pY -= speed; direction = 'up'; }
            if (keys['KeyS'] || keys['ArrowDown']) { pY += speed; direction = 'down'; }
            if (keys['KeyA'] || keys['ArrowLeft']) { pX -= speed; direction = 'left'; }
            if (keys['KeyD'] || keys['ArrowRight']) { pX += speed; direction = 'right'; }

            // Stoppa gubben så den inte går utanför banan
            pX = Math.max(0, Math.min(468, pX));
            pY = Math.max(0, Math.min(368, pY));
            
            // Flytta gubben på skärmen
            playerEl.style.left = pX + 'px';
