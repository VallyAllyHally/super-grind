<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Monster Grind</title>
    <style>
        body {
            background-color: #1e1e24;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 10px;
            margin: 0;
        }
        .game-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #2a2a35;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .stats {
            display: flex;
            justify-content: space-around;
            font-size: 1.1rem;
            margin-bottom: 10px;
            background: #1a1a20;
            padding: 10px;
            border-radius: 5px;
        }
        canvas {
            background-color: #43523d; /* Gräsmatta-färg */
            border: 4px solid #8B4513; /* Träram runt banan */
            border-radius: 5px;
            display: block;
            margin: 0 auto;
        }
        .controls-info {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #bbb;
        }
        .upgrade-btn {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 5px;
        }
        .upgrade-btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        #game-over-screen {
            display: none;
            color: #ff4a4a;
            background: rgba(0,0,0,0.8);
            position: absolute;
            top: 200px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid red;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>⚔️ RPG Monster Grind ⚔️</h1>
        
        <div class="stats">
            <div>❤️ Liv: <span id="hp">100</span>/<span id="max-hp">100</span></div>
            <div>💰 Guld: <span id="gold">0</span></div>
            <div>👾 Våg: <span id="level">1</span></div>
        </div>

        <!-- Spelplanen -->
        <div style="position: relative;">
            <canvas id="gameCanvas" width="500" height="400"></canvas>
            
            <div id="game-over-screen">
                <h2>💀 GAME OVER 💀</h2>
                <button class="upgrade-btn" onclick="restartGame()" style="background-color: #ff4a4a;">Starta om</button>
            </div>
        </div>

        <div class="controls-info">
            <p>🕹️ <strong>Styrning:</strong> Piltangenterna eller WASD för att gå. <strong>Mellanslag (Space)</strong> för att slå med svärdet!</p>
            <button id="buy-hp-btn" class="upgrade-btn" onclick="buyMaxHp()">Köp mer Max-HP (+20) 💰 <span id="hp-cost">20</span> guld</button>
            <button id="buy-dmg-btn" class="upgrade-btn" onclick="buyDamage()">Köp vassare svärd (+2 skada) 💰 <span id="dmg-cost">15</span> guld</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Spelare (Din gubbe)
        let player = {
            x: 250,
            y: 200,
            size: 15,
            speed: 3.5,
            hp: 100,
            maxHp: 100,
            gold: 0,
            damage: 5,
            isAttacking: false,
            attackTimer: 0,
            direction: 'right'
        };

        let enemies = [];
        let waveLevel = 1;
        let gameOver = false;
        
        let hpCost = 20;
        let dmgCost = 15;

        // Tangentbordsstyrning
        let keys = {};
        window.addEventListener("keydown", (e) => { 
            keys[e.code] = true; 
            if (e.code === "Space" && !player.isAttacking && !gameOver) {
                player.isAttacking = true;
                player.attackTimer = 12; // Hur länge svärdet svingas
                checkSwordHit();
            }
            if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault(); // Stoppar sidan från att skrolla
            }
        });
        window.addEventListener("keyup", (e) => { keys[e.code] = false; });

        function restartGame() {
            player.hp = player.maxHp;
            player.gold = 0;
            player.damage = 5;
            player.x = 250;
            player.y = 200;
            enemies = [];
            waveLevel = 1;
            hpCost = 20;
            dmgCost = 15;
            gameOver = false;
            document.getElementById("game-over-screen").style.display = "none";
            spawnEnemies();
            updateUI();
        }

        function spawnEnemies() {
            if (enemies.length === 0) {
                let count = 2 + waveLevel;
                for (let i = 0; i < count; i++) {
                    // Placera fiender utanför eller vid kanten
                    let x = Math.random() > 0.5 ? 20 : canvas.width - 20;
                    let y = Math.random() * (canvas.height - 40) + 20;
                    enemies.push({
                        x: x,
                        y: y,
                        size: 12,
                        hp: 5 + (waveLevel * 3),
                        maxHp: 5 + (waveLevel * 3),
                        speed: 0.8 + (waveLevel * 0.1)
                    });
                }
                document.getElementById("level").innerText = waveLevel;
                waveLevel++;
            }
        }

        function checkSwordHit() {
            let swordX = player.x;
            let swordY = player.y;
            let range = 30;

            if (player.direction === 'right') swordX += range;
            if (player.direction === 'left') swordX -= range;
            if (player.direction === 'up') swordY -= range;
            if (player.direction === 'down') swordY += range;

            for (let i = enemies.length - 1; i >= 0; i--) {
                let enemy = enemies[i];
                let dist = Math.hypot(swordX - enemy.x, swordY - enemy.y);
                
                if (dist < enemy.size + 25) {
                    enemy.hp -= player.damage;
                    
                    // Knockback (skjut tillbaka fienden)
                    if (player.direction === 'right') enemy.x += 30;
                    if (player.direction === 'left') enemy.x -= 30;
                    if (player.direction === 'up') enemy.y -= 30;
                    if (player.direction === 'down') enemy.y += 30;

                    if (enemy.hp <= 0) {
                        enemies.splice(i, 1);
                        player.gold += 5;
                    }
                }
            }
            updateUI();
        }

        function buyMaxHp() {
            if (player.gold >= hpCost) {
                player.gold -= hpCost;
                player.maxHp += 20;
                player.hp = player.maxHp;
                hpCost = Math.floor(hpCost * 1.5);
                updateUI();
            }
        }

        function buyDamage() {
            if (player.gold >= dmgCost) {
                player.gold -= dmgCost;
                player.damage += 2;
                dmgCost = Math.floor(dmgCost * 1.6);
                updateUI();
            }
        }

        function updateUI() {
            document.getElementById("hp").innerText = player.hp;
            document.getElementById("max-hp").innerText = player.maxHp;
            document.getElementById("gold").innerText = player.gold;
            document.getElementById("hp-cost").innerText = hpCost;
            document.getElementById("dmg-cost").innerText = dmgCost;
            
            document.getElementById("buy-hp-btn").disabled = player.gold < hpCost;
            document.getElementById("buy-dmg-btn").disabled = player.gold < dmgCost;
        }

        // Här ritar vi spelet
        function gameLoop() {
            if (gameOver) return;

            // 1. Rensa skärmen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 2. Flytta gubben baserat på knappar
            if (keys["KeyW"] || keys["ArrowUp"]) { player.y -= player.speed; player.direction = 'up'; }
            if (keys["KeyS"] || keys["ArrowDown"]) { player.y += player.speed; player.direction = 'down'; }
            if (keys["KeyA"] || keys["ArrowLeft"]) { player.x -= player.speed; player.direction = 'left'; }
            if (keys["KeyD"] || keys["ArrowRight"]) { player.x += player.speed; player.direction = 'right'; }

            player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x));
            player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y));

            // 3. Hantera fiender
            spawnEnemies();
            
            enemies.forEach((enemy, index) => {
                // Gå mot spelaren
                let angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
                enemy.x += Math.cos(angle) * enemy.speed;
                enemy.y += Math.sin(angle) * enemy.speed;

                // RITA FIENDE (Ett rött monster med ögon)
                ctx.fillStyle = "#a62c2c";
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, enemy.size, 0, Math.PI * 2);
                ctx.fill();
                // Ögon på monstret
                ctx.fillStyle = "#fff";
                ctx.fillRect(enemy.x - 4, enemy.y - 5, 3, 3);
                ctx.fillRect(enemy.x + 2, enemy.y - 5, 3, 3);

                // Fiendens livmätare
                ctx.fillStyle = "red";
